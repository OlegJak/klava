<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klava — английский через набор текста</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header class="top">
    <div class="lesson-picker">
      <button id="lesson-btn" class="lesson-btn" aria-haspopup="true" aria-expanded="false">
        <span id="lesson-icon" class="lesson-icon"></span>
        <span class="lesson-name"><small id="lesson-group"></small><b id="lesson-title"></b></span>
        <span class="chev">▾</span>
      </button>
      <div id="lesson-menu" class="lesson-menu" hidden></div>
    </div>
    <button id="restart" class="icon-btn" title="Начать заново (Esc)">↻</button>
    <div class="stats">
      <span title="Скорость последней набранной строки, знаков в минуту"><b id="cpm">—</b> зн/мин</span>
      <span title="Точность"><b id="acc">—</b></span>
      <span title="Ошибки" class="err"><b id="errors">0</b> ошибок</span>
      <span title="Пройдено"><b id="progress">0/0</b></span>
    </div>
  </header>

  <main>
    <section class="board">
      <div id="typed" class="typed"></div>
      <div id="text" class="text" aria-live="polite"></div>
      <div class="hint">
        <span id="translation" class="translation"></span>
        <button id="speak" class="icon-btn" title="Произнести (Ctrl+Space)">🔊</button>
      </div>
      <div id="lookup" class="lookup" hidden></div>
      <div id="layout-warn" class="warn" hidden>Переключите раскладку на английскую</div>
    </section>

    <section id="custom-box" class="custom" hidden>
      <textarea id="custom-text" rows="5" placeholder="Вставьте любой английский текст и нажмите «Начать»"></textarea>
      <button id="custom-start">Начать</button>
    </section>

    <div id="keyboard" class="keyboard"></div>

    <footer class="bottom">
      <div class="options-head">
        <h3>Настройки</h3>
        <span id="best" class="best"></span>
        <button id="theme" class="pill-btn">Тёмная тема</button>
      </div>
      <div class="options">
        <label class="opt">
          <input type="checkbox" id="show-tr" checked><span class="switch"></span>
          <span class="opt-text"><b>Перевод</b><small>Показывать перевод слова или фразы</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="auto-speak"><span class="switch"></span>
          <span class="opt-text"><b>Озвучка</b><small>Произносить каждую новую фразу</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="keep-errors"><span class="switch"></span>
          <span class="opt-text"><b>Не исправлять ошибки</b><small>Курсор идёт дальше, исправить — Backspace</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hardcore"><span class="switch"></span>
          <span class="opt-text"><b>Хардкор</b><small>Backspace или Delete стирает всю строку</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="show-kb" checked><span class="switch"></span>
          <span class="opt-text"><b>Клавиатура</b><small>Показывать клавиатуру <kbd>Ctrl+K</kbd></small></span>
        </label>
      </div>
    </footer>
  </main>

  <div id="word-tools" class="word-tools" hidden>
    <b class="wt-text"></b>
    <button data-act="speak" title="Произнести">🔊</button>
    <button data-act="add">+ В словарь</button>
    <button data-act="more">Ещё фразы</button>
  </div>

  <div id="result" class="result" hidden>
    <div class="card">
      <h2>Урок пройден!</h2>
      <p id="result-text"></p>
      <button id="again">Ещё раз</button>
    </div>
  </div>

  <script src="data.js?v=9"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
