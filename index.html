<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klava — английский через набор текста</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=56">
</head>
<body>
  <!-- Экраны-страницы: главная, папка, модуль. Содержимое рисует app.js по адресу после # -->
  <div id="page" class="page-screen" hidden>
    <header class="top">
      <a href="#/" class="brand"><span class="brand-mark">K</span>Klava</a>
      <nav id="crumbs" class="crumbs"></nav>
      <span id="account" class="account"></span>
      <button class="pill-btn theme-btn">Тёмная тема</button>
    </header>
    <main id="page-body" class="page"></main>
  </div>

  <!-- Тренажёр набора -->
  <div id="trainer" hidden>
  <header class="top">
    <a id="back" class="lesson-btn" href="#/" title="К модулю">
      <span class="back-arrow">←</span>
      <span id="lesson-icon" class="lesson-icon"></span>
      <span class="lesson-name"><small id="lesson-group"></small><b id="lesson-title"></b></span>
    </a>
    <button id="restart" class="icon-btn" title="Начать заново (Esc)">↻</button>
    <div class="stats">
      <span title="Скорость последней набранной строки, знаков в минуту"><b id="cpm">—</b> зн/мин</span>
      <span title="Точность"><b id="acc">—</b></span>
      <span title="Ошибки" class="err"><b id="errors">0</b> ошибок</span>
      <span title="Пройдено"><b id="progress">0/0</b></span>
    </div>
  </header>

  <main>
    <section class="board">
      <div id="typed" class="typed"></div>
      <div id="text" class="text" aria-live="polite"></div>
      <div class="hint">
        <span id="translation" class="translation"></span>
        <button id="speak" class="icon-btn" title="Произнести (Ctrl+Space)" data-icon="volume"></button>
      </div>
      <div id="explain" class="explain" hidden></div>
      <div id="lookup" class="lookup" hidden></div>
      <div id="layout-warn" class="warn" hidden>Переключите раскладку на английскую</div>
    </section>

    <section id="custom-box" class="custom" hidden>
      <textarea id="custom-text" rows="5" placeholder="Вставьте любой английский текст и нажмите «Начать»"></textarea>
      <button id="custom-start">Начать</button>
    </section>

    <div id="keyboard" class="keyboard"></div>

    <footer class="bottom">
      <div class="options-head">
        <h3>Настройки</h3>
        <span id="best" class="best"></span>
        <button class="pill-btn theme-btn">Тёмная тема</button>
      </div>
      <div class="options">
        <label class="opt">
          <input type="checkbox" id="show-tr" checked><span class="switch"></span>
          <span class="opt-text"><b>Перевод</b><small>Показывать перевод слова или фразы</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="show-explain" checked><span class="switch"></span>
          <span class="opt-text"><b>Объяснения</b><small>Почему здесь это время, конструкция или предлог</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="auto-read" checked><span class="switch"></span>
          <span class="opt-text"><b>Озвучка</b><small>Читать вслух каждую новую строку</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="keep-errors"><span class="switch"></span>
          <span class="opt-text"><b>Не исправлять ошибки</b><small>Курсор идёт дальше, исправить — Backspace</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hardcore"><span class="switch"></span>
          <span class="opt-text"><b>Хардкор</b><small>Backspace или Delete стирает всю строку</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="dictation"><span class="switch"></span>
          <span class="opt-text"><b>Диктант</b><small>Фраза только звучит — наберите на слух, Enter — проверить</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="translate-mode"><span class="switch"></span>
          <span class="opt-text"><b>Перевод на английский</b><small>Видна только русская фраза — наберите её по-английски, Enter — проверить</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="show-kb" checked><span class="switch"></span>
          <span class="opt-text"><b>Клавиатура</b><small>Показывать клавиатуру <kbd>Ctrl+K</kbd></small></span>
        </label>
        <div id="voice-box" class="voice-card">
          <div class="voice-head">
            <b>Голос</b>
            <button id="voice-test" class="pill-btn" title="Произнести текущую фразу" data-icon="play"> Проверить</button>
          </div>
          <select id="voice" aria-label="Голос озвучки"></select>
          <label class="rate">Скорость
            <input type="range" id="rate" min="0.6" max="1.2" step="0.05">
            <span id="rate-val"></span>
          </label>
        </div>
      </div>
    </footer>
  </main>
  </div>

  <div id="word-tools" class="word-tools" hidden>
    <b class="wt-text"></b>
    <button data-act="speak" title="Произнести" data-icon="volume"></button>
    <button data-act="add">+ В словарь</button>
    <button data-act="more">Ещё фразы</button>
  </div>

  <div id="result" class="result" hidden>
    <div class="card">
      <h2>Урок пройден!</h2>
      <p id="result-text"></p>
      <button id="again">Ещё раз</button>
    </div>
  </div>

  <!-- Связь с облаком: ошибки сохранения и входа -->
  <div id="cloud-banner" class="cloud-banner" hidden></div>
  <!-- Всплывающие уведомления и конфетти -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <canvas id="confetti" class="confetti" hidden></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="data.js?v=31"></script>
  <script src="core.js?v=15"></script>
  <script src="cloud.js?v=1"></script>
  <script src="icons.js?v=4"></script>
  <script src="app.js?v=57"></script>
</body>
</html>
